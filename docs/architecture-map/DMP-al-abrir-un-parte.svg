<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1840" viewBox="0 0 2400 1840" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b9c91"/></marker></defs><rect width="100%" height="100%" fill="#eef3f5"/><rect x="0" y="0" width="2400" height="235" rx="0" fill="#143d46" /><text x="80" y="65" font-size="23" fill="#9ad7c7" font-weight="700">DMP / ARQUITECTURA EN USO</text><text x="80" y="135" font-size="54" fill="#fff" font-weight="700">Qué hace DMP cuando abres un parte</text><text x="80" y="193" font-size="25" fill="#d2e6e8" font-weight="400">React muestra la pantalla; los servicios consultan Supabase; PostgreSQL verifica el acceso y los cambios.</text><path d="M770 462.5L855 462.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M1545 462.5L1630 462.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M1975 635L1975 700" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M1630 872.5L1545 872.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M855 872.5L770 872.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M425 1045L425 1110" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M770 1282.5L855 1282.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M1545 1282.5L1630 1282.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="290" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="80" y="290" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="108" y="339" font-size="25" fill="#458e80" font-weight="700">01</text><text x="172" y="340" font-size="32" fill="#173e47" font-weight="700">Entras en una ruta</text><text x="108" y="395" font-size="25" fill="#295461" font-weight="600">React Router interpreta /app/…</text><text x="108" y="429" font-size="25" fill="#295461" font-weight="600">El ID identifica el recurso solicitado.</text><text x="108" y="463" font-size="25" fill="#607781" font-weight="400">La ruta elige pantalla y espacio de trabajo.</text><text x="108" y="497" font-size="25" fill="#607781" font-weight="400">Una URL sola no concede acceso.</text><rect x="855" y="290" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="855" y="290" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="883" y="339" font-size="25" fill="#458e80" font-weight="700">02</text><text x="947" y="340" font-size="32" fill="#173e47" font-weight="700">Restaura la sesión</text><text x="883" y="395" font-size="25" fill="#295461" font-weight="600">Supabase Auth + profiles</text><text x="883" y="429" font-size="25" fill="#295461" font-weight="600">Auth identifica al usuario.</text><text x="883" y="463" font-size="25" fill="#607781" font-weight="400">El perfil aporta empresa, actividad y roles.</text><text x="883" y="497" font-size="25" fill="#607781" font-weight="400">Cambiar identidad limpia caché y contexto.</text><rect x="1630" y="290" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="1630" y="290" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="1658" y="339" font-size="25" fill="#458e80" font-weight="700">03</text><text x="1722" y="340" font-size="32" fill="#173e47" font-weight="700">Comprueba el acceso</text><text x="1658" y="395" font-size="25" fill="#295461" font-weight="600">Permisos de interfaz + RLS en BD</text><text x="1658" y="429" font-size="25" fill="#295461" font-weight="600">La app comprueba módulo y acción.</text><text x="1658" y="463" font-size="25" fill="#607781" font-weight="400">El técnico requiere asignación y estado.</text><text x="1658" y="497" font-size="25" fill="#607781" font-weight="400">PostgreSQL limita filas y operaciones.</text><rect x="1630" y="700" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="1630" y="700" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="1658" y="749" font-size="25" fill="#458e80" font-weight="700">04</text><text x="1722" y="750" font-size="32" fill="#173e47" font-weight="700">Consulta o reutiliza caché</text><text x="1658" y="805" font-size="25" fill="#295461" font-weight="600">useLoad → TanStack Query</text><text x="1658" y="839" font-size="25" fill="#295461" font-weight="600">La clave de caché incluye el ámbito.</text><text x="1658" y="873" font-size="25" fill="#607781" font-weight="400">Datos recientes pueden reutilizarse.</text><text x="1658" y="907" font-size="25" fill="#607781" font-weight="400">Refresco y errores tienen estado propio.</text><rect x="855" y="700" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="855" y="700" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="883" y="749" font-size="25" fill="#458e80" font-weight="700">05</text><text x="947" y="750" font-size="32" fill="#173e47" font-weight="700">Carga el contexto</text><text x="883" y="805" font-size="25" fill="#295461" font-weight="600">workOrdersService</text><text x="883" y="839" font-size="25" fill="#295461" font-weight="600">Cabecera, cliente, centro y equipos.</text><text x="883" y="873" font-size="25" fill="#607781" font-weight="400">Luego asignaciones, horas y consumos.</text><text x="883" y="907" font-size="25" fill="#607781" font-weight="400">Checks, decisiones, documentos y medios.</text><rect x="80" y="700" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="80" y="700" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="108" y="749" font-size="25" fill="#458e80" font-weight="700">06</text><text x="172" y="750" font-size="32" fill="#173e47" font-weight="700">Compone la pantalla</text><text x="108" y="805" font-size="25" fill="#295461" font-weight="600">React combina los resultados</text><text x="108" y="839" font-size="25" fill="#295461" font-weight="600">Muestra secciones y acciones por permiso.</text><text x="108" y="873" font-size="25" fill="#607781" font-weight="400">Las fotos privadas usan URL firmadas.</text><text x="108" y="907" font-size="25" fill="#607781" font-weight="400">Un fallo parcial puede impedir el detalle.</text><rect x="80" y="1110" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="80" y="1110" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="108" y="1159" font-size="25" fill="#458e80" font-weight="700">07</text><text x="172" y="1160" font-size="32" fill="#173e47" font-weight="700">El usuario guarda</text><text x="108" y="1215" font-size="25" fill="#295461" font-weight="600">Formulario → servicio → RPC o tabla</text><text x="108" y="1249" font-size="25" fill="#295461" font-weight="600">Se validan campos y permiso de acción.</text><text x="108" y="1283" font-size="25" fill="#607781" font-weight="400">Las RPC aplican controles de negocio.</text><text x="108" y="1317" font-size="25" fill="#607781" font-weight="400">Triggers ejecutan automatismos asociados.</text><rect x="855" y="1110" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="855" y="1110" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="883" y="1159" font-size="25" fill="#458e80" font-weight="700">08</text><text x="947" y="1160" font-size="32" fill="#173e47" font-weight="700">Conserva o sincroniza</text><text x="883" y="1215" font-size="25" fill="#295461" font-weight="600">PostgreSQL / Storage / IndexedDB</text><text x="883" y="1249" font-size="25" fill="#295461" font-weight="600">Datos estructurados van a tablas.</text><text x="883" y="1283" font-size="25" fill="#607781" font-weight="400">Binarios a Storage con metadatos en BD.</text><text x="883" y="1317" font-size="25" fill="#607781" font-weight="400">Lo local queda pendiente hasta sincronizar.</text><rect x="1630" y="1110" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="1630" y="1110" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="1658" y="1159" font-size="25" fill="#458e80" font-weight="700">09</text><text x="1722" y="1160" font-size="32" fill="#173e47" font-weight="700">Actualiza lo visible</text><text x="1658" y="1215" font-size="25" fill="#295461" font-weight="600">Resultado o error → refresco</text><text x="1658" y="1249" font-size="25" fill="#295461" font-weight="600">Se vuelve a consultar tras guardar.</text><text x="1658" y="1283" font-size="25" fill="#607781" font-weight="400">La app recalcula resumen y estado.</text><text x="1658" y="1317" font-size="25" fill="#607781" font-weight="400">Un error debe conservar contexto y datos.</text><rect x="80" y="1580" width="2240" height="185" rx="18" fill="#dcece7" /><text x="110" y="1625" font-size="27" fill="#194a42" font-weight="700">Leer y escribir son recorridos diferentes</text><text x="110" y="1668" font-size="24" fill="#315e58" font-weight="400">Abrir la ficha consulta información; las acciones explícitas pueden modificarla o ejecutar RPC con efectos de negocio.</text><text x="110" y="1702" font-size="24" fill="#315e58" font-weight="400">La imagen describe el código revisado: no se han creado partes, facturas, consumos ni cobros para preparar este mapa.</text><text x="80" y="1810" font-size="20" fill="#617985" font-weight="400">Fuentes: catálogo real de Supabase (14/10/2026) + servicios React/TypeScript del repositorio. Flujo explicativo, no ejecución de operaciones.</text></svg>