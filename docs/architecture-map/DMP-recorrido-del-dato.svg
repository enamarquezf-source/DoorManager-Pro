<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1840" viewBox="0 0 2400 1840" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b9c91"/></marker></defs><rect width="100%" height="100%" fill="#eef3f5"/><rect x="0" y="0" width="2400" height="235" rx="0" fill="#143d46" /><text x="80" y="65" font-size="23" fill="#9ad7c7" font-weight="700">DMP / ARQUITECTURA EN USO</text><text x="80" y="135" font-size="54" fill="#fff" font-weight="700">De un presupuesto a una factura cobrada</text><text x="80" y="193" font-size="25" fill="#d2e6e8" font-weight="400">Lectura orientativa del negocio. Las revisiones SAT, Comercial y económica son controles complementarios.</text><path d="M770 462.5L855 462.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M1545 462.5L1630 462.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M1975 635L1975 700" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M1630 872.5L1545 872.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M855 872.5L770 872.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M425 1045L425 1110" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M770 1282.5L855 1282.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><path d="M1545 1282.5L1630 1282.5" stroke="#5b9c91" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="290" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="80" y="290" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="108" y="339" font-size="25" fill="#458e80" font-weight="700">01</text><text x="172" y="340" font-size="32" fill="#173e47" font-weight="700">Cliente y equipo</text><text x="108" y="395" font-size="25" fill="#295461" font-weight="600">clients → sites → equipment</text><text x="108" y="429" font-size="25" fill="#295461" font-weight="600">Quién, dónde y sobre qué se actúa.</text><text x="108" y="463" font-size="25" fill="#607781" font-weight="400">Contactos y acceso completan el contexto.</text><text x="108" y="497" font-size="25" fill="#607781" font-weight="400">cases agrupa el expediente cuando existe.</text><rect x="855" y="290" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="855" y="290" width="8" height="345" rx="3" fill="#b7862c" /><text x="883" y="339" font-size="25" fill="#458e80" font-weight="700">02</text><text x="947" y="340" font-size="32" fill="#173e47" font-weight="700">Presupuesto</text><text x="883" y="395" font-size="25" fill="#295461" font-weight="600">quotes + quote_lines</text><text x="883" y="429" font-size="25" fill="#295461" font-weight="600">Define conceptos, cantidades y venta.</text><text x="883" y="463" font-size="25" fill="#607781" font-weight="400">Materiales y tarifas pueden vincularse.</text><text x="883" y="497" font-size="25" fill="#607781" font-weight="400">Sus líneas no son consumos reales.</text><rect x="1630" y="290" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="1630" y="290" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="1658" y="339" font-size="25" fill="#458e80" font-weight="700">03</text><text x="1722" y="340" font-size="32" fill="#173e47" font-weight="700">Parte asociado</text><text x="1658" y="395" font-size="25" fill="#295461" font-weight="600">work_orders + work_order_equipment</text><text x="1658" y="429" font-size="25" fill="#295461" font-weight="600">Conserva vínculo con el presupuesto.</text><text x="1658" y="463" font-size="25" fill="#607781" font-weight="400">Se asignan técnico, centro y equipos.</text><text x="1658" y="497" font-size="25" fill="#607781" font-weight="400">Trigger: al asociar equipo se genera check.</text><rect x="1630" y="700" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="1630" y="700" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="1658" y="749" font-size="25" fill="#458e80" font-weight="700">04</text><text x="1722" y="750" font-size="32" fill="#173e47" font-weight="700">Trabajo del técnico</text><text x="1658" y="805" font-size="25" fill="#295461" font-weight="600">Horas + materiales + recursos</text><text x="1658" y="839" font-size="25" fill="#295461" font-weight="600">Checks, resultados, fotos y firma.</text><text x="1658" y="873" font-size="25" fill="#607781" font-weight="400">Las decisiones técnicas registran ejecución.</text><text x="1658" y="907" font-size="25" fill="#607781" font-weight="400">Sin conexión: cola local → sincronización.</text><rect x="855" y="700" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="855" y="700" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="883" y="749" font-size="25" fill="#458e80" font-weight="700">05</text><text x="947" y="750" font-size="32" fill="#173e47" font-weight="700">Revisión SAT / Comercial</text><text x="883" y="805" font-size="25" fill="#295461" font-weight="600">dmp_review_work_order_sat</text><text x="883" y="839" font-size="25" fill="#295461" font-weight="600">Se revisa la entrega y se elige destino.</text><text x="883" y="873" font-size="25" fill="#607781" font-weight="400">Puede devolverse o pasar a Comercial.</text><text x="883" y="907" font-size="25" fill="#607781" font-weight="400">El destino controla la cola de facturación.</text><rect x="80" y="700" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="80" y="700" width="8" height="345" rx="3" fill="#b7862c" /><text x="108" y="749" font-size="25" fill="#458e80" font-weight="700">06</text><text x="172" y="750" font-size="32" fill="#173e47" font-weight="700">Revisión económica</text><text x="108" y="805" font-size="25" fill="#295461" font-weight="600">dmp_review_work_order_economic</text><text x="108" y="839" font-size="25" fill="#295461" font-weight="600">Distingue coste real de venta aprobada.</text><text x="108" y="873" font-size="25" fill="#607781" font-weight="400">Decide qué conceptos son facturables.</text><text x="108" y="907" font-size="25" fill="#607781" font-weight="400">El presupuesto y las excepciones importan.</text><rect x="80" y="1110" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="80" y="1110" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="108" y="1159" font-size="25" fill="#458e80" font-weight="700">07</text><text x="172" y="1160" font-size="32" fill="#173e47" font-weight="700">Factura de cliente</text><text x="108" y="1215" font-size="25" fill="#295461" font-weight="600">invoices + invoice_work_orders</text><text x="108" y="1249" font-size="25" fill="#295461" font-weight="600">Preparar borrador → revisar → emitir.</text><text x="108" y="1283" font-size="25" fill="#607781" font-weight="400">La RPC comprueba elegibilidad e importes.</text><text x="108" y="1317" font-size="25" fill="#607781" font-weight="400">Finalizar un parte no emite una factura.</text><rect x="855" y="1110" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="855" y="1110" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="883" y="1159" font-size="25" fill="#458e80" font-weight="700">08</text><text x="947" y="1160" font-size="32" fill="#173e47" font-weight="700">Cobro y tesorería</text><text x="883" y="1215" font-size="25" fill="#295461" font-weight="600">invoice_payments</text><text x="883" y="1249" font-size="25" fill="#295461" font-weight="600">treasury_transactions + accounts</text><text x="883" y="1283" font-size="25" fill="#607781" font-weight="400">El cobro se vincula a factura y cuenta.</text><text x="883" y="1317" font-size="25" fill="#607781" font-weight="400">Emitir no equivale a haber cobrado.</text><rect x="1630" y="1110" width="690" height="345" rx="20" fill="#fff" stroke="#d6e2e6"/><rect x="1630" y="1110" width="8" height="345" rx="3" fill="#2d8c7c" /><text x="1658" y="1159" font-size="25" fill="#458e80" font-weight="700">09</text><text x="1722" y="1160" font-size="32" fill="#173e47" font-weight="700">Consulta e historial</text><text x="1658" y="1215" font-size="25" fill="#295461" font-weight="600">Vistas de cliente, equipo y economía</text><text x="1658" y="1249" font-size="25" fill="#295461" font-weight="600">La app vuelve a consultar y muestra estado.</text><text x="1658" y="1283" font-size="25" fill="#607781" font-weight="400">El historial combina hechos del sistema.</text><text x="1658" y="1317" font-size="25" fill="#607781" font-weight="400">Documentos y auditoría conservan contexto.</text><rect x="80" y="1580" width="2240" height="185" rx="18" fill="#dcece7" /><text x="110" y="1625" font-size="27" fill="#194a42" font-weight="700">Compras y stock forman una rama paralela</text><text x="110" y="1668" font-size="24" fill="#315e58" font-weight="400">purchase_orders → purchase_receipts → stock_movements / warehouse_stock. Consumos validados: salida de stock.</text><text x="110" y="1702" font-size="24" fill="#315e58" font-weight="400">supplier_invoices → supplier_invoice_payments → tesorería. La factura de proveedor no es la factura al cliente.</text><text x="80" y="1810" font-size="20" fill="#617985" font-weight="400">Fuentes: catálogo real de Supabase (14/10/2026) + servicios React/TypeScript del repositorio. Flujo explicativo, no ejecución de operaciones.</text></svg>